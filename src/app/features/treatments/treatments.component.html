<div style="max-width:1180px;margin:0 auto;padding:clamp(40px,5vw,80px) clamp(20px,5vw,72px) 80px">
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:22px"><span style="width:44px;height:1px;background:var(--color-accent);display:block"></span><span style="font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-300)">Treatments</span></div>
  <h1 style="font-family:var(--font-heading);font-weight:500;font-size:clamp(36px,4.6vw,64px);line-height:1.08;letter-spacing:-0.02em;margin:0 0 20px;margin-left:-0.06em">Dermatology, medical<br>and aesthetic.</h1>
  <p style="font-size:17px;line-height:1.7;max-width:56ch;margin:0 0 56px;color:color-mix(in srgb, var(--color-text) 80%, transparent)">Services are grouped by what you're coming in for. Every treatment begins with a consultation, so the plan matches the condition.</p>

  @for (g of groups; track g.key) {
    <div style="padding-bottom:44px;margin-bottom:44px;border-bottom:1px solid color-mix(in srgb, var(--color-neutral-700) 60%, transparent)">
      <div [style]="trtRowGrid()">
        <div style="display:flex;flex-direction:column;height:100%">
          <h2 style="font-family:var(--font-heading);font-weight:500;font-size:28px;line-height:1.2;letter-spacing:-0.012em;margin:0 0 12px">{{ g.title }}</h2>
          <p style="font-size:15.5px;line-height:1.7;margin:0 0 18px;color:color-mix(in srgb, var(--color-text) 78%, transparent)">{{ g.blurb }}</p>
          <div class="lighten" style="border-radius:var(--radius-md);overflow:hidden;max-width:360px;margin-top:auto">
            <img [ngSrc]="pageImage(g.key)" width="1600" height="900" style="width:100%;height:auto;aspect-ratio:16/9;object-fit:cover" [alt]="g.title">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px">
          @for (t of g.items; track t) {
            <a
              [routerLink]="['/treatments', g.key]"
              style="text-align:left;cursor:pointer;font-family:var(--font-body);font-size:15px;color:var(--color-text);background:color-mix(in srgb, var(--color-surface) 55%, transparent);border:0;box-shadow:var(--shadow-sm);border-radius:var(--radius-md);padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;text-decoration:none"
            >{{ t }}<span style="color:var(--color-accent-300);font-size:13px">→</span></a>
          }
        </div>
      </div>
    </div>
  }

  <button type="button" class="btn btn-primary" routerLink="/book">Book an Appointment</button>
</div>
